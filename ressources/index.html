<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parc Sport dans la Ville, prototype</title>
<style>
:root{
  --canvas:#f5f5f7;--surface:#fff;--subtle:#f7f7f9;--muted-bg:#f1f1f4;--text:#242429;--strong:#18181b;--muted:#686872;--faint:#9a9aa3;--border:#e6e6eb;--border2:#d4d4da;
  --accent:#635bff;--accent-soft:#f0efff;--accent-ink:#4c43dc;--primary:#2a2a30;--primary-h:#3a3a42;
  --ok:#00843c;--ok-f:#009b70;--ok-bg:#e8f6ef;--warn:#b45700;--warn-f:#dd7500;--warn-bg:#fff3e6;
  --bad:#d62231;--bad-f:#e5383b;--bad-bg:#fdedef;--blue:#0b6bcf;--blue-f:#2f80ed;--blue-bg:#eaf2fd;--grey:#686872;--grey-f:#a1a1aa;--grey-bg:#f0f0f3;
  --r-card:16px;--r-modal:22px;--r-ctl:10px;--r-btn:8.8px;
  --sh-card:0 2px 5px rgb(24 24 35/4%),0 8px 22px rgb(24 24 35/6%);
  --sh-btn:inset 0 1px rgb(255 255 255/48%),0 1px 2px rgb(23 33 29/8%);
  --sh-btn-h:inset 0 1px rgb(255 255 255/52%),0 2px 6px rgb(0 0 0/8%);
  --sh-modal:0 0 0 1px rgb(24 24 40/4%),0 2px 4px rgb(24 24 40/5%),0 14px 32px -8px rgb(24 24 40/18%),0 40px 90px -20px rgb(24 24 40/30%);
  --relief:inset 0 1px 0 rgb(255 255 255/12%),0 1px 2px rgb(0 0 0/14%),0 4px 12px rgb(24 24 27/10%);
  --btn-bg:rgb(255 255 255/72%);
  --land:#ececf1;--land-s:#d6d6de;
  --ease:cubic-bezier(.2,.8,.2,1);--m:160ms var(--ease);
  font-family:Inter,"Inter Variable",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-theme=dark]{
  --canvas:#18181b;--surface:#212125;--subtle:#2b2b31;--muted-bg:#2b2b31;--text:#e4e4e9;--strong:#f4f4f7;--muted:#9d9da8;--faint:#75757f;--border:#33333a;--border2:#4a4a53;
  --accent:#a49dff;--accent-soft:#2c2a40;--accent-ink:#c3beff;--primary:#3a3a43;--primary-h:#45454f;
  --ok:#45de78;--ok-f:#32c99a;--ok-bg:#16302a;--warn:#ffaf45;--warn-f:#f39a2b;--warn-bg:#382915;--bad:#ff626b;--bad-f:#ff5a64;--bad-bg:#3b1c22;--blue:#6ea8ff;--blue-f:#4f94ff;--blue-bg:#1b2a41;--grey:#a1a1aa;--grey-f:#6b6b75;--grey-bg:#2b2b31;
  --sh-card:0 2px 5px rgb(0 0 0/18%),0 8px 22px rgb(0 0 0/22%);--sh-btn:0 1px 2px rgb(0 0 0/30%);--sh-btn-h:0 2px 6px rgb(0 0 0/40%);
  --sh-modal:inset 0 1px 0 rgb(255 255 255/6%),0 0 0 1px rgb(0 0 0/45%),0 28px 80px -16px rgb(0 0 0/75%);--relief:inset 0 1px 0 rgb(255 255 255/10%),0 1px 2px rgb(0 0 0/50%);
  --btn-bg:#26262b;--land:#2a2a30;--land-s:#3c3c45;
}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}
html,body{background:var(--canvas);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{transition:background-color 150ms ease,color 150ms ease}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.hdr{position:sticky;top:0;z-index:40;height:64px;background:color-mix(in srgb,var(--canvas) 82%,transparent);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent;transition:border-color var(--m)}
.hdr.scrolled{border-bottom-color:var(--border)}
.hdr-in{display:flex;align-items:center;gap:8px;height:100%;padding:0 32px;max-width:1520px;margin:0 auto}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#7068ff,#4b40d8);display:grid;place-items:center;color:#fff;box-shadow:var(--relief);flex:none;margin-right:4px}
.mark svg{width:18px;height:18px;stroke-width:2.4}
.brand{font-weight:750;font-size:15px;color:var(--strong)}
.crumbs{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:13px;min-width:0;margin-left:10px}
.crumbs button{padding:4px 7px;border-radius:7px;color:var(--muted);transition:var(--m);white-space:nowrap}.crumbs button:hover{background:var(--muted-bg);color:var(--text)}
.crumbs .cur{color:var(--text);font-weight:600}
.crumbs svg{width:14px;height:14px;color:var(--faint)}
.sp{flex:1}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;min-width:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-btn);background:var(--btn-bg);box-shadow:var(--sh-btn);color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;transition:color var(--m),background-color var(--m),border-color var(--m),box-shadow var(--m)}
.hb:hover{color:var(--text);border-color:var(--border2);background:var(--surface);box-shadow:var(--sh-btn-h)}
.hb.icon{width:40px;padding:0}
.hb.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 38%,var(--border));background:var(--accent-soft)}
.hb kbd{font:inherit;font-size:11px;font-weight:600;color:var(--faint);margin-left:4px}
.theme-ic{display:grid;place-items:center;animation:themeIn 160ms ease-out}
@keyframes themeIn{from{opacity:.4;transform:rotate(-20deg) scale(.85)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:var(--r-ctl);font-weight:620;font-size:13px;transition:background-color var(--m),transform var(--m),box-shadow var(--m),border-color var(--m);white-space:nowrap}
.btn.pri{background:var(--primary);color:#fff;box-shadow:var(--relief)}.btn.pri:hover{background:var(--primary-h)}
.btn.sec{background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-btn)}.btn.sec:hover{border-color:var(--border2);box-shadow:var(--sh-btn-h)}
.btn.ghost{color:var(--muted);padding:0 10px}.btn.ghost:hover{background:var(--muted-bg);color:var(--text)}
.btn.sm{height:32px;font-size:12.5px;padding:0 11px;border-radius:9px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.42;pointer-events:none}

/* page */
.page{max-width:1520px;margin:0 auto;padding:22px 32px 48px;transition:padding-right 300ms var(--ease)}
body.phone-open .page{padding-right:430px;max-width:none}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:26px;font-weight:820;color:var(--strong);letter-spacing:-.022em;line-height:1.2}
.sub{color:var(--muted);margin-top:4px;font-size:13.5px}
.demo{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-btn);font-size:13px;font-weight:600;color:var(--text);transition:var(--m);position:relative}
.demo:hover{border-color:var(--border2);box-shadow:var(--sh-btn-h)}
.ring{width:26px;height:26px;flex:none}
.demo .go{height:28px;padding:0 11px;border-radius:999px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;box-shadow:var(--relief)}
.demo .go svg{width:12px;height:12px;fill:currentColor;stroke:none}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-modal);padding:8px;z-index:50;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity 160ms ease,transform 200ms var(--ease);text-align:left}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pstep{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:11px;width:100%;text-align:left;transition:background var(--m)}
.pstep:hover{background:var(--subtle)}
.pstep .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--muted-bg);color:var(--muted);flex:none}
.pstep.done .n{background:var(--ok-f);color:#fff}.pstep.done .n svg{width:13px;height:13px;stroke-width:3}
.pstep.cur{background:var(--accent-soft)}.pstep.cur .n{background:var(--accent);color:#fff}
.pstep .t{font-weight:620;font-size:13px;color:var(--strong)}
.pstep .d{font-size:12px;color:var(--muted);margin-top:1px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh-card);border:1px solid var(--border)}
.kpi{padding:14px 16px 13px;text-align:left;transition:border-color var(--m),transform var(--m),box-shadow var(--m);position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--text) 14%,var(--border))}
.kpi.sel{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:0 0 0 3px var(--accent-soft),var(--sh-card)}
.kpi .l{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:780;color:var(--strong);margin-top:6px;letter-spacing:-.02em;line-height:1.1}
.kpi .c{font-size:11.5px;color:var(--faint);margin-top:3px}
.kpi:after{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow,var(--accent)) 9%,transparent),transparent 60%);opacity:0;transition:opacity 200ms;pointer-events:none}
.kpi:hover:after{opacity:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.v2{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 5px;margin-left:2px}

.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr);gap:18px;align-items:start}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
.ch h2{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.count{font-size:11px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{position:relative;display:inline-flex;background:var(--muted-bg);border-radius:12px;padding:3px;isolation:isolate}
.seg:before{content:"";position:absolute;z-index:-1;left:var(--sx,3px);top:3px;width:var(--sw,0);height:calc(100% - 6px);background:var(--surface);border-radius:9px;box-shadow:0 1px 2px rgb(0 0 0/8%),0 1px 1px rgb(0 0 0/4%);transition:left 240ms var(--ease),width 240ms var(--ease)}
.seg button{padding:5px 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:color var(--m);white-space:nowrap}
.seg button.on{color:var(--text)}
.seg button svg{width:14px;height:14px}
.seg .b{font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--surface);color:var(--muted);display:inline-grid;place-items:center}
.seg button.on .b{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;padding:0 16px 4px}
.drop{position:relative}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:var(--m);white-space:nowrap}
.chip:hover{border-color:var(--border2)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.chip svg{width:14px;height:14px}
.menu{position:absolute;left:0;top:calc(100% + 6px);min-width:240px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh-modal);padding:6px;z-index:30;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity 140ms,transform 180ms var(--ease)}
.menu.show{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;text-align:left;gap:8px;align-items:center}
.menu button:hover{background:var(--subtle)}
.menu button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.menu .cnt{margin-left:auto;color:var(--faint);font-size:12px}
.search{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--faint);margin-left:auto;width:230px;transition:border-color var(--m),box-shadow var(--m)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;outline:0;background:none;width:100%;font-size:12.5px;color:var(--text)}
.search svg{width:14px;height:14px}

/* map */
.mapbox{position:relative;height:590px;margin:8px;border-radius:12px;overflow:hidden;background:radial-gradient(110% 80% at 45% 40%,color-mix(in srgb,var(--accent) 4%,var(--surface)),var(--subtle))}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map .land{fill:var(--land);stroke:var(--land-s);stroke-width:1.1;vector-effect:non-scaling-stroke}
.pin{cursor:pointer}
.pin .core{transition:transform 180ms var(--ease);transform-box:fill-box;transform-origin:center}
.pin:hover .core{transform:scale(1.12)}
.pin.enter{animation:pinIn 380ms var(--ease) both}
@keyframes pinIn{from{opacity:0}}
.mlabel{font-weight:650;fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--sh-btn);overflow:hidden}
.mctl button{width:34px;height:34px;display:grid;place-items:center;color:var(--muted);transition:var(--m)}
.mctl button+button{border-top:1px solid var(--border)}
.mctl button:hover{background:var(--subtle);color:var(--text)}
.mctl svg{width:15px;height:15px}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:11.5px;color:var(--muted);box-shadow:var(--sh-btn)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fresh{position:absolute;left:12px;top:12px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--border);border-radius:999px;padding:6px 10px}
.live{width:6px;height:6px;border-radius:50%;background:var(--ok-f);animation:live 2.2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok-f) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tip{position:absolute;pointer-events:none;background:var(--strong);color:var(--canvas);font-size:12px;padding:6px 9px;border-radius:9px;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity 120ms;white-space:nowrap;line-height:1.35}
.vwrap{position:relative}
.view{transition:opacity 180ms ease,transform 220ms var(--ease)}
.view.hide{display:none}
.view.fade{animation:vin 240ms var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(4px)}}

/* status */
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:999px;font-size:11.5px;font-weight:620;white-space:nowrap}
.st svg{width:13px;height:13px;stroke-width:2.4}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-bad{background:var(--bad-bg);color:var(--bad)}.s-blue{background:var(--blue-bg);color:var(--blue)}.s-grey{background:var(--grey-bg);color:var(--grey)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--muted-bg);color:var(--muted);white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.acc{background:var(--accent-soft);color:var(--accent)}.tag.rec{background:var(--bad-bg);color:var(--bad)}

/* inbox */
.side{position:sticky;top:82px}
.list{padding:2px 8px 8px;max-height:560px;overflow:auto}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 10px;border-radius:12px;transition:background var(--m)}
.row:hover{background:var(--subtle)}
.row .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.row .ic svg{width:16px;height:16px;stroke-width:2.2}
.row .t{font-weight:620;color:var(--strong);font-size:13.5px;line-height:1.35}
.row .m{color:var(--muted);font-size:12px;margin-top:2px}
.row .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.row .r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;flex:none}
.stag{animation:rin 320ms var(--ease) both}
@keyframes rin{from{opacity:0;transform:translateY(6px)}}
.fresh-row{animation:flash 1.8s ease}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{width:28px;height:28px;color:var(--faint);margin-bottom:8px}
.cfoot{display:flex;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background var(--m)}tbody tr:hover{background:var(--subtle)}
.tbl{max-height:590px;overflow:auto;margin:8px;border-radius:12px}
.sm{font-size:11.5px;color:var(--muted)}

/* panel terrain */
.ph{padding:16px 16px 6px}
.ph .e{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.ph h3{font-size:19px;font-weight:780;color:var(--strong);letter-spacing:-.015em;margin-top:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px}
.kv div{background:var(--subtle);border-radius:11px;padding:8px 11px;font-size:11.5px;color:var(--muted)}
.kv b{display:block;color:var(--text);font-size:13px;font-weight:620}

/* modal */
.ov{position:fixed;inset:0;background:rgb(20 20 30/24%);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 180ms ease;padding:24px}
[data-theme=dark] .ov{background:rgb(0 0 0/55%)}
.ov.show{opacity:1;pointer-events:auto}
.modal{width:min(960px,100%);max-height:calc(100vh - 48px);background:var(--surface);border-radius:var(--r-modal);box-shadow:var(--sh-modal);display:flex;flex-direction:column;transform:translateY(12px) scale(.985);transition:transform 260ms var(--ease);overflow:hidden}
.ov.show .modal{transform:none}
.modal.sm{width:min(540px,100%)}
.mh{display:flex;gap:14px;align-items:flex-start;padding:22px 24px 10px}
.mic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.mic svg{width:21px;height:21px}
.mh .e{font-size:12px;font-weight:600;color:var(--muted)}
.mh h3{font-size:19px;font-weight:780;color:var(--strong);letter-spacing:-.015em}
.mb{padding:8px 24px 20px;overflow:auto}
.mf{display:flex;align-items:center;gap:8px;padding:14px 24px 18px;border-top:1px solid var(--border)}
.mf .info{font-size:12px;color:var(--muted);margin-right:auto}
.x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);margin-left:auto;transition:var(--m);flex:none}.x:hover{background:var(--muted-bg);color:var(--text)}
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.box{background:var(--subtle);border-radius:14px;padding:14px}
.box h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;margin-bottom:10px}
.lines{display:grid;gap:7px;font-size:13px}
.lines div{display:flex;gap:10px}.lines span{color:var(--muted)}.lines b{margin-left:auto;font-weight:600;text-align:right}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border);border-radius:2px}
.tli{position:relative;padding-bottom:13px}.tli:last-child{padding-bottom:0}
.tli:before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--subtle);border:2.5px solid var(--c,var(--grey-f))}
.tli .d{font-size:11px;color:var(--faint);font-weight:600}.tli .w{font-weight:620;font-size:13px;color:var(--strong)}.tli .s{font-size:12px;color:var(--muted)}
.alert{display:flex;gap:10px;padding:11px 13px;border-radius:12px;font-size:12.5px;line-height:1.45}
.alert svg{width:17px;height:17px;flex:none;margin-top:1px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.info{background:var(--blue-bg);color:var(--blue)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.acc{background:var(--accent-soft);color:var(--accent-ink)}
.alert b{display:block}
.photos{display:flex;gap:10px}
.pho{flex:1;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:4/3}
.pho span{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:650;background:rgb(0 0 0/55%);color:#fff;padding:2px 7px;border-radius:6px}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.fld label{font-size:12px;font-weight:620;color:var(--muted)}
.inp{height:40px;border:1px solid var(--border2);border-radius:var(--r-ctl);padding:0 12px;background:var(--surface);outline:0;transition:var(--m)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:8px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;font-weight:560;background:var(--surface);transition:var(--m)}
.opt:hover{border-color:var(--border2)}
.opt.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 50%,var(--border));color:var(--accent)}
.qr{width:84px;height:84px;background:#fff;border-radius:10px;padding:6px;display:grid;grid-template-columns:repeat(21,1fr);flex:none;border:1px solid var(--border)}
.qr i{background:#18181b}.qr b{background:#fff}
.rtable td{cursor:default;font-size:12.5px}.rtable tr:hover{background:none}

.dock{position:fixed;right:24px;top:80px;bottom:16px;width:380px;z-index:30;display:flex;flex-direction:column;align-items:center;transform:translateX(440px);opacity:0;transition:transform 340ms var(--ease),opacity 240ms ease}
body.phone-open .dock{transform:none;opacity:1}
.dockh{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:10px}

.ab{flex:1;min-height:0;overflow:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.ab>*{flex:none}
.pc{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgb(0 0 0/5%)}
.pc .t{font-weight:650;color:#18181b;font-size:14px}
.pc .m{font-size:12px;color:#686872}
.pl{font-size:11px;font-weight:700;color:#80808a;text-transform:uppercase;letter-spacing:.06em;margin:4px 4px 0}

.vfb{width:176px;height:176px;position:relative}
.vfb i{position:absolute;width:38px;height:38px;border:3px solid #fff}
.vfb i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}.vfb i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.vfb i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 16px}.vfb i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 16px 0}

@keyframes scanl{0%,100%{top:14%}50%{top:84%}}

 const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),220)};t.querySelector('[data-x]').onclick=kill;
 t.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;kill();if(a==='phone')openPhone();else if(a.startsWith('carnet:'))openCarnet(a.slice(7));else if(a.startsWith('terrain:'))openTerrain(a.slice(8))});setTimeout(kill,7000)}

  <div class="pl">${esc(t.name)}</div>${t.eqs.map(id=>{const e=E(id);return `<div class="pc" style="display:flex;align-items:center;gap:10px;padding:11px 14px"><span class="dot" style="background:${ST[e.st].f};width:10px;height:10px"></span><div style="flex:1"><div class="t" style="font-size:13.5px">${esc(e.type)}</div><div class="m">${ST[e.st].l}</div></div></div>`}).join('')}</div>`;}
 else if(P.scr==='scan'){b=`<div class="ah"><button class="back" id="pBack">${L('cl')}Retour</button><div class="big">Scanner</div></div><div class="vf"><div class="vfb"><i></i><i></i><i></i><i></i><div class="vfl"></div></div><div style="position:absolute;bottom:12px;color:#fff;font-size:12px;opacity:.75">Visez le QR code de l'équipement</div></div>
  <div class="ab" style="padding-top:12px"><div class="pl">Simuler le scan</div>${t.eqs.map(id=>{const e=E(id);return `<button class="pc" style="text-align:left;display:flex;align-items:center;gap:10px" data-scan="${id}"><span class="dot" style="background:${ST[e.st].f};width:10px;height:10px"></span><div style="flex:1"><div class="t" style="font-size:13.5px">${esc(e.type)}</div><div class="m num">${id}</div></div>${L('cr')}</button>`}).join('')}</div>`;}
 else if(P.scr==='form'){const d=P.draft,e=E(d.eid);const ok=d.type&&d.cat&&d.txt.trim().length>2&&d.urg;
  b=`<div class="ah"><button class="back" id="pBack">${L('cl')}Annuler</button><div class="big">Signaler</div><div class="hi" style="margin-top:2px">${esc(e.type)}, ${esc(t.name)}</div></div><div class="ab">

 else if(P.scr==='saved'||P.scr==='verified'){const ok=P.scr==='saved'?true:P.lastOk;const off=P.scr==='saved'&&!P.net;

  <div class="m" style="max-width:250px;color:#686872;font-size:13px">${P.scr==='saved'?(off?'Il partira dès que le réseau revient, même si vous fermez l\'app.':'Attribué automatiquement. Les bonnes personnes sont prévenues.'):(ok?'L\'équipement repasse au vert, la photo « après » est dans le carnet.':'Le directeur est prévenu pour relancer une intervention.')}</div>
  <button class="pb pri" style="width:100%;margin-top:8px" id="pHome">Retour à l'accueil</button></div>`;}
 else if(P.scr==='verify'){const v=P.cur,e=E(v.eid);b=`<div class="ah"><button class="back" id="pBack">${L('cl')}Retour</button><div class="big">Vérifier</div><div class="hi">${esc(e.type)}, ${esc(t.name)}</div></div><div class="ab">
  <div class="pc"><div class="pl" style="margin:0 0 8px">Photo de départ</div><div style="border-radius:12px;overflow:hidden;height:118px">${photo('before')}</div></div>

 $('#scr').innerHTML=sbar+`<div class="screen" style="display:flex;flex-direction:column;flex:1;min-height:0">${b}</div><div class="hind"></div>`;
 const on=(id,f)=>{const el=$('#scr').querySelector(id);if(el)el.onclick=f};
 on('#net',()=>{P.net=!P.net;renderPhone();if(P.net)sync()});on('#pScan',()=>{P.scr='scan';renderPhone();renderDemo()});on('#pBack',()=>{P.scr='home';renderPhone();renderDemo()});on('#pHome',()=>{P.scr='home';renderPhone()});
 $('#scr').querySelectorAll('[data-scan]').forEach(x=>x.onclick=()=>{const eid=x.dataset.scan,vi=P.verify.findIndex(v=>v.eid===eid);if(vi>-1){P.cur={...P.verify[vi],ix:vi};P.scr='verify'}else{P.draft={eid,type:null,cat:null,txt:'',photo:false,urg:null};P.scr='form'}renderPhone();renderDemo()});
 $('#scr').querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{P.cur={...P.verify[+x.dataset.v],ix:+x.dataset.v};P.scr='verify';renderPhone()});
 if(P.scr==='form'){const d=P.draft;const re=()=>{const sc=$('#scr .ab').scrollTop;renderPhone();$('#scr .ab').scrollTop=sc;$('#scr .screen').style.animation='none'};
  $('#scr').querySelectorAll('[data-type]').forEach(x=>x.onclick=()=>{d.type=x.dataset.type;re()});$('#scr').querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{d.cat=x.dataset.cat;re()});$('#scr').querySelectorAll('[data-urg]').forEach(x=>x.onclick=()=>{d.urg=x.dataset.urg;re()});
  $('#ptxt').oninput=ev=>{d.txt=ev.target.value;$('#pSend').disabled=!(d.type&&d.cat&&d.txt.trim().length>2&&d.urg)||offWeb};on('#pPhoto',()=>{d.photo=true;re()});
  on('#pSend',()=>{P.queue.push({eid:d.eid,type:d.type,cat:d.cat,txt:d.txt,urg:d.urg,t:new Date(),st:'wait',offline:!P.net});P.scr='saved';renderPhone();renderDemo();if(P.net)sync()})}
 if(P.scr==='verify'){on('#pAfter',()=>{P.cur.after=true;renderPhone();$('#scr .screen').style.animation='none'});on('#pOK',()=>verify(true));on('#pKO',()=>verify(false))}}
function sync(){const todo=S.ph.queue.filter(q=>q.st==='wait');if(!todo.length)return;todo.forEach(q=>q.st='send');renderPhone();setTimeout(()=>{todo.forEach(q=>{q.st='ok';receive(q)});renderPhone()},1300)}
function receive(q){const e=E(q.eid),t=T(e.t);e.st=q.urg==='Danger'?'bad':'warn';e.photo={d:q.t};
 e.hist.push({d:q.t,k:'inc',w:'Incident signalé'+(q.urg==='Danger'?' : Danger':''),s:`${q.type}, ${q.cat}. « ${q.txt} »${q.offline?' (saisi hors ligne, reçu à '+fT(new Date())+')':''}`,c:q.urg==='Danger'?'var(--bad-f)':'var(--warn-f)'});
 incidents.forEach(i=>i.fresh=false);const inc={id:'INC-2026-'+(520+incidents.length),eq:e.id,d:new Date(),txt:`${q.cat} : ${q.txt}`,cat:q.cat,urg:q.urg,by:t.rst,taken:false,offline:q.offline,fresh:true};incidents.push(inc);
 const r=route(inc);S.box=r.owner===me()?'mine':r.info.includes(me())?'info':'all';S.sel=null;renderAll();
 toast('teams',`Teams, canal Infra ${REG[t.reg]}`,`<b>${esc(e.type)}, ${esc(t.name)}</b><br>${esc(q.cat)}, urgence ${esc(q.urg)}${q.offline?', saisi hors ligne':''}.<br><span class="sm">Attribué à ${esc(r.owner)} (règle ${r.rule.id})</span>`,[['Ouvrir le carnet','carnet:'+e.id]]);
 if(q.urg==='Danger')setTimeout(()=>toast('mail','Mail immédiat',`<b>Danger</b> : ${esc(e.type)}, ${esc(t.name)}. Envoyé à ${esc(r.owner)} et au suppléant.`),650);
 if(r.info.length)setTimeout(()=>toast('info','Teams, pour info',`${esc(r.info.join(', '))} : « Incident sérieux sur ${esc(t.name)}, à regarder ».`),1300)}

 if(ok){e.st='ok';e.photo=e.photo||{d:new Date()};e.photo.after=true;e.hist.push({d:new Date(),k:'val',w:'Validé par le RST',s:`${t.rst}, photo « après » jointe`,c:'var(--ok-f)'});if(inc)inc.closed=true}
 else{e.st='warn';e.hist.push({d:new Date(),k:'inc',w:'Vérification KO, incident rouvert',s:t.rst,c:'var(--warn-f)'});if(inc){inc.taken=false}}

/* ===== démo guidée ===== */
const STEPS=[['Scanner le QR','Téléphone RST, « Scanner un QR code », puis le but de football.'],['Signaler hors réseau','3 champs, photo, urgence Danger, puis « Enregistrer sur le téléphone ».'],['Retour du réseau','Touchez « Hors réseau » : envoi, attribution automatique, messages.'],['Enregistrer l\'intervention','Côté directeur, ouvrez le carnet du but puis « Enregistrer l\'intervention ».'],['Vérification RST','Sur le téléphone, « À vérifier », photo après, puis « OK, validé ».'],['Carnet à jour','Historique daté, photos avant et après, attribution.']];
function cur(){const P=S.ph,he=E(HERO.e);if(he.hist.some(h=>h.k==='val'&&h.d>NOW))return 6;if(he.st==='blue')return 5;if(['warn','bad'].includes(he.st))return 4;if(P.queue.some(q=>q.eid===HERO.e&&q.st!=='ok'))return 3;if(P.scr==='form'&&P.draft&&P.draft.eid===HERO.e)return 2;return 1}
function ringSvg(k){const C=2*Math.PI*10;return `<svg class="ring" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="var(--muted-bg)" stroke-width="3"/><circle cx="13" cy="13" r="10" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-k)}" transform="rotate(-90 13 13)" style="transition:stroke-dashoffset 400ms var(--ease)"/></svg>`}
function renderDemo(){const c=cur(),done=c===6&&E(HERO.e).st==='ok';
 $('#bDemo').innerHTML=`${ringSvg((done?6:c-1)/6)}<span class="hide-sm">Démo guidée</span><span style="color:var(--muted);font-weight:500" class="num hide-sm">${done?'terminée':`étape ${c} sur 6`}</span><span class="go">${L('play')}${done?'Revoir':'Continuer'}</span>`;
 $('#pop').innerHTML=`<div style="padding:8px 10px 6px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Scénario du PRD</div>`+STEPS.map(([t,d],i)=>{const n=i+1,cls=n<c||done?'done':n===c?'cur':'';return `<button class="pstep ${cls}" data-s="${n}"><span class="n">${cls==='done'?L('check'):n}</span><span><div class="t">${t}</div><div class="d">${d}</div></span></button>`}).join('');
 $('#pop').querySelectorAll('.pstep').forEach(b=>b.onclick=e=>{e.stopPropagation();$('#pop').classList.remove('show');guide(+b.dataset.s)})}
function guide(n){if(n<=3){openPhone();S.mode='app';$('#modeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m==='app'));seg($('#modeSeg'));
  if(n===1){S.ph.scr='home';S.ph.net=false}if(n===2&&S.ph.scr!=='form'){S.ph.draft={eid:HERO.e,type:null,cat:null,txt:'',photo:false,urg:null};S.ph.scr='form';S.ph.net=false}if(n===3)S.ph.scr='home';renderPhone()}
 if(n===4){openTerrain(HERO.t);setTimeout(()=>openCarnet(HERO.e),450)}if(n===5){openPhone();S.ph.scr='home';renderPhone()}if(n===6)openCarnet(HERO.e);renderDemo()}

/* ===== boot ===== */
hydrate();
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;$('#bTheme').innerHTML=`<span class="theme-ic">${L(t==='light'?'moon':'sun')}</span>`;$('#bTheme').title=t==='light'?'Passer au thème sombre':'Passer au thème clair'}
$('#bTheme').onclick=()=>setTheme(S.theme==='light'?'dark':'light');
$('#bRole').onclick=()=>pickPersona(false);$('#bPhone').onclick=()=>S.phoneOpen?closePhone():openPhone();$('#bClosePh').onclick=closePhone;
$('#bSearch').onclick=openSearch;$('#bArch').onclick=openArch;
$('#bDemo').onclick=e=>{e.stopPropagation();$('#pop').classList.toggle('show')};
$('#bReg').onclick=e=>{e.stopPropagation();$('#mReg').classList.toggle('show')};
document.addEventListener('click',e=>{if(!e.target.closest('#pop'))$('#pop').classList.remove('show');if(!e.target.closest('.drop'))$('#mReg').classList.remove('show')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#pop').classList.remove('show')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
$('#bReset').onclick=()=>{build();S.ph={net:false,scr:'home',draft:null,queue:[],verify:[],cur:null,lastOk:null};S.kpi=null;S.q='';$('#q').value='';closeModal();$('#toasts').innerHTML='';goFrance();renderPhone()};
$('#vSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;$('#vSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));seg($('#vSeg'));const a=S.view==='map'?$('#vMap'):$('#vList'),o=S.view==='map'?$('#vList'):$('#vMap');o.classList.add('hide');a.classList.remove('hide');a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade');if(S.view==='map')drawPins()});
$('#modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;$('#modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));seg($('#modeSeg'));renderPhone()});
$('#q').oninput=e=>{S.q=e.target.value;drawPins();renderTable()};
document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{const k=th.dataset.s;S.sort={k,d:S.sort.k===k?-S.sort.d:1};renderTable()});
window.addEventListener('scroll',()=>$('#hdr').classList.toggle('scrolled',scrollY>4),{passive:true});
window.addEventListener('resize',()=>{drawPins();seg($('#vSeg'));seg($('#bSeg'))});
build();setTheme('light');renderRole();initMap();renderAll();renderPhone();seg($('#vSeg'));seg($('#modeSeg'));
if(!location.hash.includes('nopick'))pickPersona(true);
</script>
</body></html>
